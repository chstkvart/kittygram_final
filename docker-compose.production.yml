volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13.10
    environment:
    POSTGRES_DB: django_db
    POSTGRES_USER: django_user
    POSTGRES_PASSWORD: django_password
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: andos12/kittygram_backend:latest
    env_file: .env
    command: sh -c "python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:9000 kittygram_backend.wsgi"
    volumes:
      - static:/static
      - media:/media
    depends_on:
      - db
  frontend:
    image: andos12/kittygram_frontend:latest
    env_file: .env
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static

  gateway:
    image: andos12/kittygram_gateway:latest
    env_file: .env
    volumes:
      - static:/static
      - media:/media 
    ports:
      - 9000:80
    depends_on:
      - backend
      - frontend

