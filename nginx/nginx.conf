server {
  listen 80;

  location /static/ {
    alias /app/staticfiles/;
  }

  location /media/ {
    alias /app/media/;
  }

  location /api/ {
    proxy_pass http://backend:9000/api/;
    proxy_set_header Host $http_host;
  }

  location /admin/ {
    proxy_pass http://backend:9000/admin/;
    proxy_set_header Host $http_host;
  }

  location / {
    alias /app/staticfiles/;
    try_files $uri $uri/ /index.html;
  }
}